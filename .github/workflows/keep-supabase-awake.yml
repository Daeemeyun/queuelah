name: Keep Supabase awake

# Supabase free-tier projects are PAUSED after 7 days with no API activity.
# A paused project means the live App Store app returns nothing - an empty map
# for anyone who opens it. This job makes one small read per day so the project
# never goes idle long enough to be paused.
#
# Runs at an odd minute, off the hour: GitHub's scheduler is heavily loaded at
# :00 and delays or drops those runs.

on:
  schedule:
    - cron: '17 3 * * *'   # 03:17 UTC daily = 11:17 SGT
  workflow_dispatch:        # lets you trigger it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one row from the database
        env:
          # This is the PUBLISHABLE (anon) key. It is public by design: it ships
          # inside the iOS app bundle and is hardcoded in app/lib/supabase.ts.
          # Every table it can reach is protected by Row Level Security, so it
          # grants no privileged access. Deliberately inlined rather than stored
          # as a repo secret, so this workflow keeps working with zero setup.
          SUPABASE_URL: https://nlftqhwufytvjsphfxaz.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_pl45Q5lA7sqaAeTh2fIwOA_LHwXtCnO
        run: |
          set -euo pipefail
          echo "Pinging $SUPABASE_URL ..."
          CODE=$(curl -sS -m 30 -o /tmp/resp.json -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/eateries?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "HTTP $CODE"
          head -c 200 /tmp/resp.json || true
          echo
          if [ "$CODE" != "200" ]; then
            echo "::error::Supabase did not return 200. The project may be paused or degraded."
            exit 1
          fi
          echo "Project is awake."
